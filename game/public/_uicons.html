<!doctype html><meta charset="utf-8"><body style="margin:0;background:#15161c"><canvas id="c"></canvas><pre id="o" style="color:#f88"></pre>
<script type="module">
import * as I from "./uiicons.js";
const cv = document.getElementById("c"), g = cv.getContext("2d");
const z = 7, W = 12 * z + 20;
cv.width = 10 * W; cv.height = 4 * W + 20;
g.imageSmoothingEnabled = false;
g.fillStyle = "#15161c"; g.fillRect(0, 0, cv.width, cv.height);
I.ALL.forEach((id, i) => {
  const x = (i % 10) * W + 10, y = Math.floor(i / 10) * W + 10;
  g.fillStyle = "#23252e"; g.fillRect(x - 5, y - 5, 12 * z + 10, 12 * z + 10);
  g.drawImage(I.icon(id), x, y, 12 * z, 12 * z);
});
// the eight elite traits in their colours, large and at the size they float over a monster
Object.keys(I.TRAIT).forEach((k, i) => { const [n, c] = I.TRAIT[k]; g.drawImage(I.icon(n, c), 10 + i * W, 3 * W + 10, 12 * z, 12 * z); g.drawImage(I.icon(n, c), 10 + 8 * W + (i % 4) * 20, 3 * W + 14 + Math.floor(i / 4) * 22, 18, 18); });
document.getElementById("o").textContent = I.badRows().join(" ");
document.title = "ready";
</script>
