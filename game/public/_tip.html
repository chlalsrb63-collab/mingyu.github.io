<!doctype html><meta charset="utf-8">
<!-- Item tooltips with fake entries, no server: node scripts/shot.mjs --page tip [--q "hud=linen&ts=l&w=300"]
     (the real items.js itemTip over a stub G.defs / G.self; the 유니크 words and item levels are stubs of the rules' contract) -->
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="hud.css">
<style>
  body { margin: 0; padding: 10px; background: #46604c; min-height: 100vh; box-sizing: border-box; }
  .scene { display: inline-block; vertical-align: top; margin: 0 14px 14px 0; }
  .scene > h4 { margin: 0 0 4px; font: 11px/1.3 "Galmuri11", sans-serif; color: #fff6dc; text-shadow: 1px 1px 0 #000; }
  .host { width: max-content; max-width: 100%; }
  .host.pane { width: 300px; padding: 5px 7px; background: #17131d; border: 2px solid #000; box-sizing: border-box; }
  #stage { visibility: visible; }
</style>
<body data-hud="brass" data-lay="full">
<div id="stage"></div>
<div id="app" hidden></div>
<script type="module">
// the game's own markup (windows.js / hud.js look their elements up at import), kept hidden
const doc = new DOMParser().parseFromString(await (await fetch("index.html")).text(), "text/html");
doc.querySelectorAll("script").forEach((s) => s.remove());
document.getElementById("app").innerHTML = doc.body.innerHTML;

const q = new URLSearchParams(location.search);
if (q.get("ts")) document.body.dataset.ts = q.get("ts");
const { G } = await import("./state.js");
const { itemTip } = await import("./items.js");
const Keymap = await import("./keymap.js");
if (q.get("hud")) Keymap.hudTheme(q.get("hud"));

const items = {
  a_4: { name: "철갑 흉갑", type: "armor", tier: 4, base: { def: 24, hp: 140 }, req: 34, price: 4000 },
  a_6: { name: "운철 흉갑", type: "armor", tier: 6, base: { def: 52, hp: 300 }, req: 61, price: 30000 },
  w_sword_5: { name: "강철 양손검", type: "weapon", wk: "sword", cls: "warrior", tier: 5, base: { atk: 48 }, req: 46, price: 9000 },
  h_5: { name: "고래뼈 투구", type: "helm", tier: 5, base: { def: 14, hp: 80 }, req: 46, price: 6000 },
  r_3: { name: "은 반지", type: "ring", tier: 3, base: { crit: 3 }, req: 22, price: 1200 },
  rn_4: { name: "네온 장갑", type: "gloves", tier: 4, base: { def: 9, spd: 4 }, req: 34, price: 3000, set: "runner" },
  hp_2: { name: "붉은 물약", type: "pot", price: 40, desc: "HP를 120 회복합니다." },
};
G.defs = {
  items,
  rarity: ["일반", "마법", "희귀", "전설", "세트", "유니크"],
  affix: {
    atk: ["공격력", "날카로운"], atkp: ["공격력 %", "맹렬한"], def: ["방어력", "단단한"], hp: ["최대 HP", "강인한"], mp: ["최대 MP", "지혜의"],
    crit: ["치명타 %", "예리한"], critd: ["치명타 피해 %", "잔혹한"], ls: ["흡혈 %", "흡혈의"], spd: ["이동속도 %", "신속의"], xp: ["경험치 %", "깨달음의"],
  },
  wkinds: { sword: { name: "양손검" } }, classes: { warrior: { name: "전사" } },
  legend: { chain: ["뇌명의", "공격 시 25% 확률로 번개가 주변 적 2명에게 튄다 (60%)"] },
  sets: { runner: { name: "네온 러너", bonus: [[2, [["crit", 6]]], [4, [["atkp", 15], ["spd", 8]]]] } },
  runes: { cel: ["셀", "spd", 3], acu: ["아쿠", "crit", 3] },
  runewords: [{ name: "질풍", seq: ["cel", "acu"], add: [["spd", 6], ["crit", 6]] }],
  slots: ["weapon", "helm", "armor", "gloves", "boots", "ring1", "ring2", "amulet"],
  // the rules agent's contract: un = [prefix index, suffix index], words in defs.uniq
  uniq: { pre: ["서리불꽃의", "잿빛 가면의"], suf: ["지평선을 거니는 자", "끝없는 겨울"] },
};
const legArmor = { id: "a_6", q: 3, il: 62, enh: 2, lg: "chain", af: [["hp", 90], ["def", 6], ["ls", 2], ["critd", 14]] };
const eq = {
  armor: legArmor,
  weapon: { id: "w_sword_5", q: 2, il: 50, af: [["atk", 7], ["crit", 3], ["spd", 4]] },
  ring1: { id: "r_3", q: 1, il: 30, af: [["atk", 2], ["hp", 15]] },
  ring2: { id: "r_3", q: 2, il: 38, af: [["crit", 4], ["xp", 5], ["ls", 1]] },
  gloves: { id: "rn_4", q: 4, il: 45, set: "runner", af: [["atk", 3], ["spd", 3]] },
};
G.self = { lvl: 60, cls: "warrior", eq, inv: [] };

const unique = { id: "a_6", q: 5, il: 66, un: [0, 1], af: [["def", 11], ["hp", 160], ["crit", 4], ["ls", 3]] };
const scenes = [
  ["유니크 갑옷 vs 장착 중인 전설 갑옷", unique, {}],
  ["전설 무기 (홈·룬어) vs 장착 중인 희귀 무기", { id: "w_sword_5", q: 3, il: 80, enh: 3, lg: "chain", af: [["atk", 9], ["atkp", 6], ["crit", 4], ["critd", 12]], sk: 2, ru: ["cel", "acu"] }, {}],
  ["착용 레벨 부족 (희귀 투구, il 80 → 착용 레벨 70, 내 레벨 60)", { id: "h_5", q: 2, il: 80, af: [["hp", 40], ["def", 5], ["mp", 20]] }, {}],
  ["마법 반지 vs 반지 2개 모두", { id: "r_3", q: 1, il: 40, af: [["atk", 3], ["crit", 2]] }, {}],
  ["상점 물건 (il 없음 → 기본 착용 레벨), 가격", { id: "a_4" }, { price: "4,000G" }],
  ["세트 조각 (장갑)", { id: "rn_4", q: 4, set: "runner", af: [["atk", 3], ["spd", 2]] }, {}],
  ["착용 중인 물건 (비교 없음)", unique, { worn: true }],
  ["물약", { id: "hp_2" }, { price: "40G" }],
];
const stage = document.getElementById("stage");
scenes.forEach(([label, entry, o], i) => {
  const sc = document.createElement("div"); sc.className = "scene";
  const h = document.createElement("h4"); h.textContent = label;
  const host = document.createElement("div"); host.className = "host"; host.id = "s" + i;
  if (q.get("w")) { host.style.width = q.get("w") + "px"; host.classList.add("pane"); }
  sc.append(h, host); stage.append(sc);
  itemTip(entry, host, o);
});
if (q.get("only")) for (const sc of [...stage.children]) if (!sc.querySelector("#s" + q.get("only"))) sc.remove();
document.fonts.ready.then(() => { window.__done = true; document.title = "ready"; });
</script>
