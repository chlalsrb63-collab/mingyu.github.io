<!doctype html><meta charset="utf-8"><title>…</title><body style="margin:0;background:#3a5a3a;font:12px sans-serif;color:#eee"><canvas id="c"></canvas>
<script type="module">
// Dev-only preview of the player looks (species.js): ?m=species | parts | presets | cmp
import * as SP from "./sprites.js";
import * as SPC from "./species.js";
const q = new URLSearchParams(location.search), mode = q.get("m") || "species", z = +(q.get("z") || 4);
const cv = document.getElementById("c"), g = cv.getContext("2d");
const views = ["front", "side", "back"];
const fig = (look, view, f, x, y, s = z) => { const fr = SP.personSheet(SP.playerLook("warrior", look))[view][f]; g.drawImage(fr, 6, 8, 20, 22, x, y, 20 * s, 22 * s); };
const label = (t, x, y) => { g.fillStyle = "#fff"; g.font = "12px sans-serif"; g.fillText(t, x, y); };
g.imageSmoothingEnabled = false;
if (mode === "species") {
  // every species with its fitting parts, in three views and two frames (a step, the breath), on two grounds
  const n = SPC.SPECIES.length, cw = 20 * z + 4, W = cw * 6 + 10;
  const cols = 3;
  cv.width = W * cols; cv.height = Math.ceil(n / cols) * (22 * z + 22);
  SPC.SPECIES.forEach((sp, i) => {
    const x0 = (i % cols) * W, y0 = Math.floor(i / cols) * (22 * z + 22);
    g.fillStyle = i % 2 ? "#4a6a48" : "#6aa864"; g.fillRect(x0, y0, W, 22 * z + 22);
    const look = SPC.withSpecies([0, 0, 0, 0, 0, 0, 0], i);
    views.forEach((v, j) => { fig(look, v, 0, x0 + j * cw, y0 + 16); fig(look, v, 2, x0 + (j + 3) * cw, y0 + 16); });
    label(i + " " + sp.name, x0 + 4, y0 + 12);
  });
} else if (mode === "faces") {
  // big: front, side, back of each species (or of a list of looks given as ?l=a.b.c,…)
  const L = q.get("l") ? q.get("l").split("_").map((t) => t.split(".").map(Number)) : SPC.SPECIES.map((_, i) => SPC.withSpecies([0, 0, 0, +(q.get("fur") || 0), 0, 0, 0], i));
  const cols = +(q.get("c") || 4), cw = 20 * z * 3 + 16, rh = 22 * z + 20;
  cv.width = cols * cw; cv.height = Math.ceil(L.length / cols) * rh;
  L.forEach((look, i) => {
    const x0 = (i % cols) * cw, y0 = Math.floor(i / cols) * rh;
    g.fillStyle = (i + Math.floor(i / cols)) % 2 ? "#4a6a48" : "#6aa864"; g.fillRect(x0, y0, cw, rh);
    views.forEach((v, j) => fig(look, v, +(q.get("f") || 0), x0 + j * 20 * z, y0 + 16));
    label(i + " " + (q.get("l") ? look.join(".") : SPC.SPECIES[i].name), x0 + 4, y0 + 12);
  });
} else if (mode === "presets") {
  const P = SPC.PRESETS, cols = 5, cw = 20 * z * 3 + 20;
  cv.width = cols * cw; cv.height = Math.ceil(P.length / cols) * (22 * z + 22);
  P.forEach(([name, look], i) => {
    const x0 = (i % cols) * cw, y0 = Math.floor(i / cols) * (22 * z + 22);
    g.fillStyle = ["#6aa864", "#d9c49a", "#565a68"][(i + Math.floor(i / cols)) % 3]; g.fillRect(x0, y0, cw, 22 * z + 22);
    views.forEach((v, j) => fig(look, v, 0, x0 + j * 20 * z, y0 + 16));
    label(name, x0 + 4, y0 + 12);
  });
} else if (mode === "parts") {
  // every option of every part, on a cat and a bear base, front and side
  const key = q.get("p") || "eye", pi = SPC.LI[key], n = SPC.LOOK_N[pi], bases = [SPC.withSpecies([0, 0, 0, 0, 3, 0, 0], 1), SPC.withSpecies([0, 0, 0, 9, 0, 0, 1], 4), SPC.withSpecies([0, 0, 0, 15, 3, 0, 9], 5)];
  const cw = 20 * z + 4;
  cv.width = Math.min(16, n) * cw * 2 + 10; cv.height = bases.length * Math.ceil(n / 16) * (22 * z + 20) + 10;
  g.fillStyle = "#6aa864"; g.fillRect(0, 0, cv.width, cv.height);
  bases.forEach((base, b) => {
    for (let v = 0; v < n; v++) {
      const look = base.slice(); look[pi] = v;
      const x0 = (v % 16) * cw * 2, y0 = (b * Math.ceil(n / 16) + Math.floor(v / 16)) * (22 * z + 20);
      fig(look, "front", 0, x0, y0 + 14); fig(look, key === "tail" ? "back" : "side", key === "tail" ? 0 : 0, x0 + cw, y0 + 14);
      label(v + " " + (SPC.PARTS[pi].names ? SPC.PARTS[pi].names[v] : ""), x0 + 2, y0 + 11);
    }
  });
} else if (mode === "small") {
  // at play size (×3 like the game, ×1 too), a crowd of random looks
  cv.width = 1200; cv.height = 600;
  g.fillStyle = "#6aa864"; g.fillRect(0, 0, 1200, 300); g.fillStyle = "#565a68"; g.fillRect(0, 300, 1200, 300);
  let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 60; i++) {
    const look = SPC.LOOK_N.map((n) => Math.floor(rnd() * n));
    fig(look, views[i % 2], 0, 10 + (i % 20) * 58, 10 + Math.floor(i / 20) * 95, 3);
  }
  SPC.PRESETS.forEach(([, look], i) => fig(look, "front", 0, 10 + i * 24, 560, 1));
} else if (mode === "cmp") {
  // identity: an old look drawn the old way (no species) and through species.js must match pixel for pixel
  const old = (lk) => ({ ear: lk[0], eye: lk[1], nose: lk[2], fur: SPC.PARTS[3].colors[lk[3]], blush: [ "#f6a8a0", "#f07882", "#f8ba7c", null][lk[4]], pat: lk[5], cloth: SPC.PARTS[6].colors[lk[6]] });
  const N = [6, 6, 5, 10, 4, 4, 6];
  let s = 11, bad = 0, n = 0;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const looks = [];
  for (let i = 0; i < 7; i++) for (let v = 0; v < N[i]; v++) { const l = [0, 0, 0, 0, 0, 0, 0]; l[i] = v; looks.push(l); }
  for (let k = 0; k < 600; k++) looks.push(N.map((m) => Math.floor(rnd() * m)));
  const px = (c) => c.getContext("2d").getImageData(0, 0, 32, 32).data;
  const first = [];
  for (const lk of looks) {
    const a = SP.personSheet(old(lk)), b = SP.personSheet(SP.playerLook("mage", lk));
    for (const v of views) for (let f = 0; f < 6; f++) {
      n++;
      const pa = px(a[v][f]), pb = px(b[v][f]);
      let same = true;
      for (let i = 0; i < pa.length; i++) if (pa[i] !== pb[i]) { same = false; break; }
      if (!same) { bad++; if (first.length < 8) first.push([lk.join(","), v, f]); }
    }
  }
  cv.width = 10; cv.height = 10;
  document.body.append(JSON.stringify({ n, bad, first }));
  document.title = bad ? "bad" : "ok";
}
if (document.title === "…") document.title = "ready";
</script>
