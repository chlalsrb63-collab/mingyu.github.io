<!doctype html><meta charset="utf-8"><body style="margin:0;background:#15161c"><canvas id="c"></canvas><pre id="o" style="color:#f88"></pre>
<script type="module">
// Housing art preview: every furniture icon (houseart.js) big and at size, then each piece as the room
// draws it (iso_interior.js roomPiece) turned N W S E.   ?z=6 icon zoom · ?pz=3 piece zoom · ?style=cottage
import { furnIcon, FURN_ICONS } from "./houseart.js";
import { roomPiece } from "./iso_interior.js";
const q = new URLSearchParams(location.search);
const z = +(q.get("z") || 5), pz = +(q.get("pz") || 3), style = q.get("style") || "cottage";
const CH = { fn_chair: "k", fn_table: "o", fn_plant: "g", fn_lamp: "*", fn_barrel: "w", fn_shelf: "b", fn_teddy: "(", fn_armchair: "s", fn_fishbowl: ")", fn_cat: "%",
  fn_trophy: "t", fn_music: "?", fn_bed: "p", fn_hearth: "#", fn_chest_wood: "[", fn_chest_iron: "{", fn_chest_magic: "}" };
const cv = document.getElementById("c"), g = cv.getContext("2d");
const per = 10, W = 16 * z + 16, pieces = Object.keys(CH), PW = 48 * pz;
cv.width = Math.max(per * W, 4 * PW + 160) + 20; cv.height = Math.ceil(FURN_ICONS.length / per) * W + 60 + pieces.length * (52 * pz) + 40;
g.imageSmoothingEnabled = false;
g.fillStyle = "#15161c"; g.fillRect(0, 0, cv.width, cv.height);
const bad = [];
FURN_ICONS.forEach((id, i) => {
  const x = (i % per) * W + 12, y = Math.floor(i / per) * W + 12, ic = furnIcon(id);
  g.fillStyle = "#3a3048"; g.fillRect(x - 4, y - 4, 16 * z + 8, 16 * z + 8);
  g.drawImage(ic, x, y, 16 * z, 16 * z);
  g.drawImage(ic, x + 16 * z - 18, y + 16 * z + 2 - 18, 16, 16);
});
let y0 = Math.ceil(FURN_ICONS.length / per) * W + 40;
g.font = "12px sans-serif"; g.fillStyle = "#c8c0d8";
for (const id of pieces) {
  g.fillStyle = "#c8c0d8"; g.fillText(id, 4, y0 + 14);
  for (let d = 0; d < 4; d++) {
    // a 3 × 3 room: the piece in the middle, floor round it, turned d
    const m = { w: 3, h: 3, o: ["   ", " " + CH[id] + " ", "   "], g: ["fff", "fff", "fff"], style, fd: { "1,1": d } };
    const pc = roomPiece(m, 1, 1);
    const cx = 150 + d * PW + PW / 2, cy = y0 + 34 * pz;
    g.fillStyle = "#c48a52";
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + 16 * pz, cy + 8 * pz); g.lineTo(cx, cy + 16 * pz); g.lineTo(cx - 16 * pz, cy + 8 * pz); g.closePath(); g.fill();
    if (!pc) { bad.push(id + " draws nothing"); continue; }
    g.drawImage(pc.img, cx + pc.dx * pz, cy + pc.dy * pz, pc.img.width * pz, pc.img.height * pz);
  }
  y0 += 52 * pz;
}
document.getElementById("o").textContent = bad.join("\n");
document.title = "ready";
</script>
